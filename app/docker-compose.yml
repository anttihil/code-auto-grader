version: '3.8'

services:
  postgres:
    image: postgres:15-alpine
    container_name: code-grader-db
    environment:
      POSTGRES_USER: code_grader
      POSTGRES_PASSWORD: dev_password_change_in_production
      POSTGRES_DB: code_auto_grader
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      # Mount migrations for easy access
      - ./app/migrations:/migrations:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U code_grader"]
      interval: 5s
      timeout: 5s
      retries: 5

  # Test database (isolated from development)
  postgres_test:
    image: postgres:15-alpine
    container_name: code-grader-db-test
    environment:
      POSTGRES_USER: code_grader
      POSTGRES_PASSWORD: test_password
      POSTGRES_DB: code_auto_grader_test
    ports:
      - "5433:5432"  # Different port to avoid conflicts
    tmpfs:
      - /var/lib/postgresql/data  # In-memory for faster tests
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U code_grader"]
      interval: 2s
      timeout: 2s
      retries: 3

volumes:
  postgres_data:
