<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Code Auto-Grader - LLM Learning Platform</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.2/codemirror.min.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.2/theme/dracula.min.css">
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <div class="container">
        <header>
            <h1>🎓 Code Auto-Grader</h1>
            <p>LLM-Powered Code Learning Platform</p>
        </header>

        <div class="content">
            <!-- Exercise Panel -->
            <div class="exercise-panel">
                <div class="panel-header">
                    <h2>Exercise</h2>
                    <div class="exercise-controls">
                        <select id="difficulty">
                            <option value="beginner">Beginner</option>
                            <option value="intermediate">Intermediate</option>
                            <option value="advanced">Advanced</option>
                        </select>
                        <select id="topic">
                            <option value="general">General</option>
                            <option value="arrays">Arrays</option>
                            <option value="loops">Loops</option>
                            <option value="functions">Functions</option>
                            <option value="objects">Objects</option>
                            <option value="algorithms">Algorithms</option>
                        </select>
                        <select id="language">
                            <option value="javascript">JavaScript</option>
                            <option value="python">Python</option>
                        </select>
                        <button id="generateBtn" class="btn btn-primary">Generate New Exercise</button>
                        <button id="sampleBtn" class="btn btn-secondary">Load Sample</button>
                    </div>
                </div>
                
                <div id="exerciseContent" class="exercise-content">
                    <div class="loading-message">
                        <p>👋 Welcome! Click "Load Sample" for a demo or "Generate New Exercise" to create a custom problem.</p>
                    </div>
                </div>
            </div>

            <!-- Code Editor Panel -->
            <div class="editor-panel">
                <div class="panel-header">
                    <h2>Code Editor</h2>
                    <div class="editor-controls">
                        <button id="runBtn" class="btn btn-success">▶ Run Code</button>
                        <button id="submitBtn" class="btn btn-primary">✓ Submit for Grading</button>
                        <button id="clearBtn" class="btn btn-secondary">Clear</button>
                    </div>
                </div>
                
                <textarea id="codeEditor"></textarea>
                
                <div class="output-section">
                    <h3>Output</h3>
                    <div id="output" class="output"></div>
                </div>
            </div>

            <!-- Feedback Panel -->
            <div class="feedback-panel">
                <div class="panel-header">
                    <h2>AI Feedback</h2>
                </div>
                <div id="feedback" class="feedback-content">
                    <p class="info-message">Submit your code to receive AI-powered feedback and grading.</p>
                </div>
            </div>
        </div>
    </div>

    <div id="loadingOverlay" class="loading-overlay" style="display: none;">
        <div class="spinner"></div>
        <p>Processing...</p>
    </div>

    <script src="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.2/codemirror.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.2/mode/javascript/javascript.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.2/mode/python/python.min.js"></script>
    <script src="app.js"></script>
</body>
</html>
